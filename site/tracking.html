<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lacak Pesanan - SecondHand Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-nav="">
  <div id="siteNav"></div>

  <section class="page-band">
    <div class="container">
      <h1>Lacak Pesanan</h1>
      <p>Masukkan nomor invoice atau nomor resi untuk melihat status pengiriman.</p>
    </div>
  </section>

  <main class="py-5">
    <div class="container">
      <div class="stat-card mb-4">
        <form class="row g-2" id="trackForm">
          <div class="col-md-9">
            <input class="form-control" id="q" placeholder="INV-20250501-0001 atau JNE1234567890" required>
          </div>
          <div class="col-md-3">
            <button class="btn btn-primary-custom w-100 h-100" type="submit"><i class="bi bi-search"></i> Lacak</button>
          </div>
        </form>
        <div class="small text-muted mt-2">
          Contoh: <span id="samples"></span>
        </div>
      </div>
      <div id="result"></div>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const result = document.getElementById('result');

    function timeline(o) {
      if (o.status === 'cancelled') {
        return `<div class="alert alert-danger"><i class="bi bi-x-circle"></i> Pesanan ini dibatalkan.</div>`;
      }
      const idx = ORDER_FLOW.indexOf(o.status);
      const steps = [
        { key: 'pending', label: 'Pesanan Masuk' },
        { key: 'confirmed', label: 'Dikonfirmasi' },
        { key: 'processing', label: 'Diproses' },
        { key: 'shipped', label: 'Dikirim' },
        { key: 'delivered', label: 'Diterima' },
        { key: 'completed', label: 'Selesai' },
      ];
      return `<div class="order-steps">${steps.map((s, i) => {
        const cls = i < idx ? 'done' : i === idx ? 'current' : '';
        const icon = i <= idx ? 'bi-check-lg' : 'bi-circle';
        return `<div class="step ${cls}">
          <span class="dot"><i class="bi ${icon}"></i></span>
          <span class="step-label">${s.label}</span>
        </div>`;
      }).join('')}</div>`;
    }

    function findOrder(term) {
      const t = term.trim().toLowerCase();
      const pool = getUser() ? getOrders() : SEED_ORDERS;
      return pool.find((o) => o.invoice.toLowerCase() === t) ||
             pool.find((o) => o.tracking && o.tracking.toLowerCase() === t);
    }

    function render(order) {
      if (!order) {
        result.innerHTML = `<div class="empty-state border rounded-3 bg-white">
          <i class="bi bi-search"></i><h5>Pesanan tidak ditemukan</h5>
          <p>Periksa kembali nomor invoice atau resi yang kamu masukkan.</p></div>`;
        return;
      }
      const st = ORDER_STATUS[order.status];
      result.innerHTML = `<div class="stat-card mb-3">
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
          <div>
            <div class="h4 fw-bold text-dark mb-0">${esc(order.invoice)}</div>
            <div class="small text-muted">Dibuat ${esc(order.createdAt)}</div>
          </div>
          <span class="badge bg-${st.badge} align-self-start"><i class="bi ${st.icon}"></i> ${st.label}</span>
        </div>
        ${timeline(order)}
        <div class="row g-3">
          <div class="col-md-6">
            <ul class="meta-list">
              <li><span>Nomor Resi</span><span>${esc(order.tracking || 'Belum tersedia')}</span></li>
              <li><span>Kurir</span><span>${order.tracking ? 'JNE / SiCepat' : '-'}</span></li>
              <li><span>Pembayaran</span><span class="text-capitalize">${esc(order.paymentMethod)}</span></li>
              <li><span>Total</span><span class="text-primary fw-bold">${fmt(order.total)}</span></li>
            </ul>
          </div>
          <div class="col-md-6">
            <div class="bg-light rounded-3 p-3 small">
              <strong class="d-block text-dark mb-1"><i class="bi bi-geo-alt"></i> Dikirim ke</strong>
              ${esc(order.address || '-')}
            </div>
          </div>
        </div>
        ${order.status === 'delivered' ? `<button class="btn btn-success mt-3" data-confirm="${order.id}"><i class="bi bi-check2"></i> Pesanan Diterima</button>` : ''}
      </div>`;

      const btn = result.querySelector('[data-confirm]');
      if (btn) btn.addEventListener('click', () => {
        advanceOrder(btn.dataset.confirm, 'completed');
        toast('Pesanan ditandai selesai', 'success');
        render(order);
      });
    }

    document.getElementById('samples').innerHTML = SEED_ORDERS
      .map((o) => `<a href="#" class="text-decoration-none me-2" data-sample="${o.invoice}">${o.invoice}</a>`)
      .join('');

    document.getElementById('samples').addEventListener('click', (e) => {
      const a = e.target.closest('[data-sample]');
      if (!a) return;
      e.preventDefault();
      document.getElementById('q').value = a.dataset.sample;
      render(findOrder(a.dataset.sample));
    });

    document.getElementById('trackForm').addEventListener('submit', (e) => {
      e.preventDefault();
      render(findOrder(document.getElementById('q').value));
    });

    const preset = qs('o');
    const auto = preset ? getOrders().find((o) => String(o.id) === String(preset)) : SEED_ORDERS[0];
    if (auto) {
      document.getElementById('q').value = auto.invoice;
      render(auto);
    }
  </script>
</body>
</html>

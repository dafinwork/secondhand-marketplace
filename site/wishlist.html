<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist Saya - SecondHand Marketplace</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-nav="">
  <div id="siteNav"></div>

  <section class="page-band">
    <div class="container">
      <h1>Wishlist</h1>
      <p>Daftar barang yang kamu simpan untuk dibeli nanti.</p>
    </div>
  </section>

  <main class="py-5">
    <div class="container">
      <div class="row g-3" id="grid"></div>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if (!requireLogin('wishlist.html')) {
      // redirect
    } else {
      function render() {
        const list = getWishlist().map(getProductById).filter(Boolean);
        if (!list.length) {
          document.getElementById('grid').innerHTML = `<div class="col-12"><div class="empty-state border rounded-3 bg-white">
            <i class="bi bi-heart"></i><h5>Wishlist masih kosong</h5>
            <p>Tekan ikon hati pada produk untuk menyimpannya di sini.</p>
            <a class="btn btn-primary-custom" href="products.html">Jelajahi Produk</a></div></div>`;
          return;
        }
        renderProducts(document.getElementById('grid'), list);
      }
      render();
    }
  </script>
</body>
</html>

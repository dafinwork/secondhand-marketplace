<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SecondHand Marketplace</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-nav="">
  <div id="siteNav"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a class="navbar-brand fs-3 d-inline-block" href="index.html"><i class="bi bi-recycle"></i> Second<span>Hand</span></a>
        <p class="text-muted small mb-0">Masuk untuk melanjutkan transaksi kamu</p>
      </div>

      <div class="alert alert-info small d-flex gap-2">
        <i class="bi bi-info-circle-fill"></i>
        <div>Versi demo: pilih salah satu akun di bawah, atau isi form dengan email akun demo.</div>
      </div>

      <div class="d-flex gap-2 mb-4" id="demoBtns"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="email">Email</label>
          <input type="email" class="form-control" id="email" required placeholder="nama@email.com" autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="password">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" required placeholder="password" autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" id="togglePw" aria-label="Tampilkan password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" checked>
            <label class="form-check-label small" for="remember">Ingat saya</label>
          </div>
          <a href="#" class="small text-decoration-none">Lupa password?</a>
        </div>
        <button class="btn btn-primary-custom w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Masuk</button>
      </form>

      <p class="text-center small text-muted mt-4 mb-0">
        Belum punya akun? <a href="register.html" class="text-decoration-none fw-semibold">Daftar gratis</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('demoBtns').innerHTML = DEMO_ACCOUNTS.map((a, i) =>
      `<button class="btn btn-outline-primary btn-sm flex-fill" data-email="${a.email}">${a.label}</button>`).join('');

    document.getElementById('demoBtns').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-email]');
      if (!b) return;
      signIn(b.dataset.email);
    });

    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      document.getElementById('togglePw').innerHTML = `<i class="bi bi-eye${show ? '-slash' : ''}"></i>`;
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      if (!Object.values(USERS).some((u) => u.email === email)) {
        toast('Email tidak terdaftar. Gunakan akun demo di atas.', 'danger');
        return;
      }
      signIn(email);
    });

    function signIn(email) {
      const user = Object.values(USERS).find((u) => u.email === email);
      save(KEY.user, { ...user, loginAt: new Date().toISOString() });
      toast('Selamat datang, ' + user.name + '!', 'success');
      setTimeout(() => (location.href = qs('next') || 'dashboard.html'), 600);
    }
  </script>
</body>
</html>
